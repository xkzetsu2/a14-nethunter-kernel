name: Kernel SukiSU (KPM + SUSFS)

on:
  push:
    branches: [suki-builtin]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante"
        type: choice
        default: noavb
        options: [noavb, noavbp, both]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((inputs.variant || 'noavb') == 'both' && '["noavb","noavbp"]' || format('["{0}"]', inputs.variant || 'noavb')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio zip lz4 brotli \
            python3 python-is-python3 device-tree-compiler xz-utils rsync kmod

      - uses: rui314/setup-mold@v1

      - name: Toolchain
        run: |
          TC="$(dirname "$GITHUB_WORKSPACE")/clang-r450784d"
          git clone --depth=1 https://gitlab.com/tejas101k/clang-r450784d.git "$TC"
          "$TC/bin/clang" --version

      - name: Preparar scripts (python3 e LOCALVERSION vazio)
        run: |
          sed -i 's/python2 /python3 /' kernel_build/*.sh
          sed -i 's|LOCALVERSION=-langsdorff-${XY_VERSION#@}-${GIT_COMMIT} |LOCALVERSION= |' kernel_build/buildnoavb.sh kernel_build/buildnoavbp.sh
          grep -n "BUILD_ARGS=" kernel_build/buildnoavb.sh
          chmod +x kernel_build/*.sh kernel_build/mkbootimg/*.py kernel_build/dtb/*.py || true

      - name: Build
        env:
          XY_TAG: suki-r${{ github.run_number }}
        run: |
          set -eo pipefail
          if [ "${{ matrix.variant }}" = "noavbp" ]; then S=buildnoavbp.sh; else S=buildnoavb.sh; fi
          bash "kernel_build/$S" "$(pwd)" 2>&1 | tee build.log

      - name: Empacotar modulos extras (para insmod manual)
        continue-on-error: true
        run: |
          mkdir -p dist-modules
          cp -r modules_out/lib/modules/* dist-modules/
          ls -la dist-modules
          (cd dist-modules && tar -czf ../dist-modules.tar.gz .)

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-extra-modules
          path: dist-modules.tar.gz
          if-no-files-found: warn

      - name: Reunir saida
        run: |
          mkdir dist
          cp kernel_build/langsdorff*.zip kernel_build/langsdorff*.tar dist/
          cp out/arch/arm64/boot/Image dist/Image
          cp out/.config dist/config
          cp out/include/config/kernel.release dist/kernel.release
          echo "kernel.release: $(cat dist/kernel.release)"
          grep -E "^CONFIG_(KSU|KPM|KSU_SUSFS)=" out/.config
          (cd dist && sha256sum * > sha256sum.txt)

      - name: KPM (patch do boot.img, artifact separado)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KPM_SUPERKEY: ${{ secrets.KPM_SUPERKEY }}
        run: |
          set -eo pipefail
          KP_TAG=0.14.0
          mkdir -p kpm dist-kpm && cd kpm
          gh release download "$KP_TAG" -R ShirkNeko/SukiSU_KernelPatch_patch -p kpimg -p kptools-linux
          chmod +x kptools-linux
          sha256sum kpimg kptools-linux
          KEY="${KPM_SUPERKEY:-$(openssl rand -hex 12)}"
          Z=$(ls ../kernel_build/langsdorff*.zip)
          T=$(ls ../kernel_build/langsdorff*.tar)
          mkdir z t
          unzip -q "$Z" -d z
          brotli -d -c z/boot.br > boot.img
          ./kptools-linux -p -i boot.img -k kpimg -s "$KEY" -o boot-kp.img > kptools.log 2>&1 || { tail -30 kptools.log; exit 1; }
          [ "$(stat -c%s boot-kp.img)" -gt "$(stat -c%s boot.img)" ]
          brotli --quality=6 -c boot-kp.img > z/boot.br
          (cd z && zip -r9 -q "../../dist-kpm/$(basename "$Z" .zip)-KPM.zip" .)
          tar -xf "$T" -C t
          lz4 -c -12 -B6 --content-size boot-kp.img > t/boot.img.lz4
          (cd t && tar -cf "../../dist-kpm/$(basename "$T" .tar)-KPM.tar" boot.img.lz4 vendor_boot.img.lz4 vbmeta.img.lz4)
          (cd ../dist-kpm && sha256sum * > sha256sum.txt)
          ls -l ../dist-kpm

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-kpm
          path: dist-kpm/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.variant }}
          path: build.log
